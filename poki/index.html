<!doctype html>
<html lang="en" data-portal="poki">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070d17" />
    <title>Snake Collector</title>
    <script type="importmap">
      {
        "imports": {
          "phaser": "./vendor/phaser.esm.js"
        }
      }
    </script>
        <script>
      window.PORTAL_CONFIG = {
        "id": "poki",
        "aspect": "16:9",
        "banner": false,
        "interstitial": "sdk-managed"
      };
    </script>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
      @font-face {
        font-family: 'Chakra Petch';
        src: url('assets/fonts/ChakraPetch-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Chakra Petch';
        src: url('assets/fonts/ChakraPetch-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #070d17;
        color: #e2e8f0;
        font-family: 'Chakra Petch', sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }

      #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #070d17;
      }

      #game-shell {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        width: 100%;
        overflow: hidden;
        background: #070d17;
      }

      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      #banner-slot {
        display: none;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 54px;
        padding: 2px 0;
        background: #050a12;
        border-top: 1px solid rgba(148, 163, 184, 0.16);
        overflow: hidden;
      }

      #banner-slot.is-visible {
        display: flex;
      }

      #banner-ad {
        position: relative;
        width: 320px;
        height: 50px;
        max-width: 100%;
        overflow: hidden;
        background: transparent;
      }

      #orientation-gate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(5, 10, 18, 0.94);
        text-align: center;
      }

      .orientation-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        max-width: 320px;
        padding: 24px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 18px;
        background: #0b1626;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      }

      .orientation-icon {
        font-size: 38px;
        line-height: 1;
        color: #38bdf8;
      }

      .orientation-card strong {
        font-size: 16px;
        letter-spacing: 0.08em;
        color: #f8fafc;
      }

      .orientation-card span {
        font-size: 12px;
        line-height: 1.5;
        color: #94a3b8;
      }

      html[data-portal="poki"] #app {
        align-items: center;
        justify-content: center;
      }

      html[data-portal="poki"] #game-shell {
        flex: 0 0 auto;
        width: min(100vw, calc(100vh * 16 / 9));
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        height: min(100dvh, calc(100vw * 9 / 16));
      }

      html[data-portal="poki"] #banner-slot {
        display: none !important;
      }

      @media (orientation: portrait) {
        html[data-portal="poki"] #orientation-gate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-shell">
        <div id="game"></div>
      </div>
      <div id="orientation-gate" aria-hidden="true">
        <div class="orientation-card">
          <div class="orientation-icon">↻</div>
          <strong>ROTATE TO LANDSCAPE</strong>
          <span>Snake Collector on Poki is designed for a wider arena. Turn your device to start.</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
